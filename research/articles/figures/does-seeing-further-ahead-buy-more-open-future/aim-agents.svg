<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 332" width="680" height="332" role="img" aria-label="Four small diagrams of four islands with the traveller at home holding the route 0 to 1 to 2. Warming fuels all six bridges. LOCAL fuels the three bridges at home. AIM-1 fuels only the bridge from home to island 1, the next crossing. AIM-2 fuels the whole route, home to 1 and 1 to 2. Compared at the same fuel flow, which fixes the mean number of bridges, only where the bridges stand differs.">
