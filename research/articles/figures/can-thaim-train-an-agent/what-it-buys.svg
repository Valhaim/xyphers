<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 468" width="680" height="468" role="img" aria-label="Grouped bar chart of the net THAIM flow, in energy per unit time, for three agents in four worlds where some builds pay. Values: ×5 store: own net THAIM 0.435, hand-written aim 0.003, THAIM receipts −0.222; ×5, hotter fuel: own net THAIM 0.257, hand-written aim 0.009, THAIM receipts −0.494; ×9 store: own net THAIM 0.095, hand-written aim −0.329, THAIM receipts −0.041; ×20, four steps: own net THAIM 0.070, hand-written aim −0.313, THAIM receipts −0.237. The agent trained on its own net THAIM flow earns the most in every world; the agent trained on THAIM receipts loses in every world.">
