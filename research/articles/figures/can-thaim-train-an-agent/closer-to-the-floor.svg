<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 444" width="680" height="444" role="img" aria-label="Grouped bar chart of thermodynamic efficiency, the Horowitz-Zhou-England floor divided by the entropy the agent produces, for three agents in four worlds. Values: ×5 store: own net THAIM 0.71, hand-written aim 0.37, fuel everywhere 0.39; ×5, hotter fuel: own net THAIM 0.75, hand-written aim 0.40, fuel everywhere 0.44; ×9 store: own net THAIM 0.52, hand-written aim 0.32, fuel everywhere 0.33; ×20, four steps: own net THAIM 0.46, hand-written aim 0.29, fuel everywhere 0.29. The agent trained on its own net THAIM flow comes 1.6 to 1.9 times closer to the floor than hand-written aim.">
<rect width="680" height="444" fill="#0b0d13"/>
<text x="20.0" y="32.0" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#f7f4eb" text-anchor="start">How close each agent comes to the thermodynamic floor</text>
<text x="20.0" y="54.0" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#878a96" text-anchor="start">efficiency = the floor's entropy over the agent's entropy (1 means at the floor)</text>
