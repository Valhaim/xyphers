<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 476" width="680" height="476" role="img" aria-label="Two strip charts of the share of possible builds each agent fuels, against how much the build multiplies the traveller's futures, on a logarithmic axis. Upper panel: cold store ×5, hot store ×2, three steps ahead. Lower panel: cold store ×9, hot store ×2. The agent trained on its own net THAIM flow fuels every build above the THAIM price (the cold store's factor) and none below it: cold store ×5: 96 of 768 builds, cold store ×9: 72 of 768 builds. The agent trained on THAIM receipts fuels builds down to its much lower receipt price: cold store ×5: 348 of 768, cold store ×9: 96 of 768.">
