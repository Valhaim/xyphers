<text x="70.0" y="210.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#878a96" text-anchor="end">0.90</text>
<line x1="80" y1="142.5" x2="580" y2="142.5" stroke="#252936" stroke-width="1"/>
