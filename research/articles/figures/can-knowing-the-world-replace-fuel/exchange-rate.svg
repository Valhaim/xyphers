<text x="70.0" y="85.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#fff6df" text-anchor="end">1</text>
<text x="584.0" y="72.0" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#fff6df" text-anchor="end">one nat for one nat</text>
<text x="90.0" y="356.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#878a96" text-anchor="middle">1</text>
