<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-label="Line chart of the fuel saved below the floor per nat of information the actions use, against the speed κ of reversible actions, for the demon world and a three-island archipelago with a sensing agent. Both rise toward exactly one. Values: demon world: κ = 1: 0.81546488, κ = 10: 0.97779464, κ = 100: 0.99773007, κ = 1000: 0.99977250, κ = 10000: 0.99997724, κ = 1000000: 0.99999977; three islands: κ = 1: 0.91537849, κ = 10: 0.99072683, κ = 100: 0.99906331, κ = 1000: 0.99990624, κ = 10000: 0.99999062, κ = 1000000: 0.99999991.">
<rect width="680" height="400" fill="#0b0d13"/>
<text x="20.0" y="32.0" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#f7f4eb" text-anchor="start">The exchange rate reaches one</text>
<text x="20.0" y="54.0" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#878a96" text-anchor="start">fuel saved below the floor, per nat of information the actions use</text>
<line x1="80" y1="330.0" x2="580" y2="330.0" stroke="#252936" stroke-width="1"/>
